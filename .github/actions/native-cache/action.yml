name: Native compiler cache
description: Reuse C/C++ compiler output while retaining normal CMake builds and tests.
runs:
  using: composite
  steps:
    - name: Install ccache
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install --yes --no-install-recommends ccache
    - name: Configure compiler cache
      id: configure
      shell: bash
      run: /usr/bin/ruby .github/scripts/native_cache.rb
    - name: Restore compiler cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/haishinkit-ccache
        key: native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.configure.outputs.image }}-${{ steps.configure.outputs.sources }}
        restore-keys: |
          native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.configure.outputs.image }}-
    - name: Initialize cache statistics
      shell: bash
      run: |
        ccache --set-config=max_size=2G
        ccache --zero-stats
