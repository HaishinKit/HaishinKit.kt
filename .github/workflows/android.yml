name: Android CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup JDK 17
        id: setup-jdk-17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        id: setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run lint and Danger
        id: run-lint-and-danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane review
      - name: Check API documentation
        id: check-documentation
        run: bundle exec fastlane check_documentation
      - name: Annotate failed steps
        if: ${{ failure() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        shell: bash
        run: |
          /usr/bin/ruby -rjson <<'RUBY'
          JSON.parse(ENV.fetch('STEPS_JSON')).each do |name, step|
            next unless step['outcome'] == 'failure'

            puts "::error title=Failed step: #{name}::The #{name} step failed. Open its logs for details; Fastlane failures also include an error annotation with the lane and cause."
          end
          RUBY
