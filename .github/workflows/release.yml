name: Release
on:
  push:
    tags:
      - '*.*.*'
permissions:
  contents: write
  checks: write
  pull-requests: write
jobs:
  build:
    outputs:
      published-tag: ${{ steps.upload-apk.outcome == 'success' && github.ref_name || '' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Validate documentation version
        id: validate-documentation-version
        shell: bash
        run: |
          # Fastlane also interpolates this value into shell commands and paths.
          if [[ ! "$RELEASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9.+-]*$ ]]; then
            echo 'Invalid documentation version' >&2
            exit 1
          fi
      - name: Setup JDK 17
        id: setup-jdk-17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        id: setup-gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - name: Setup native compiler cache
        id: setup-native-cache
        uses: ./.github/actions/native-cache
      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run lint and Danger
        id: run-lint-and-danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane review
      - name: Build signed sample APK
        id: build-apk
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEYSTORE_PATH: ${{ runner.temp }}/sample-release.jks
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$APK_KEYSTORE_PATH"' EXIT
          /usr/bin/ruby -rbase64 -e 'File.write(ENV.fetch("APK_KEYSTORE_PATH"), Base64.strict_decode64(ENV.fetch("APK_KEYSTORE_BASE64")), mode: "wb", perm: 0600)'
          bundle exec fastlane release_apk "version:$RELEASE_VERSION" "version_code:$GITHUB_RUN_NUMBER"
      - name: Upload sample APK to GitHub Release
        id: upload-apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          apk="build/release/HaishinKit-$RELEASE_VERSION.apk"
          mapping="build/release/HaishinKit-$RELEASE_VERSION-mapping.txt"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$apk" "$mapping" --clobber
          else
            gh release create "$RELEASE_VERSION" "$apk" "$mapping" --verify-tag --generate-notes
          fi
      - name: Setup SSH
        id: setup-ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Generate and publish documentation
        id: generate-and-publish-documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle exec fastlane document "version:$RELEASE_VERSION"
      - name: Report native cache statistics
        if: always()
        shell: bash
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Annotate failed steps
        if: ${{ failure() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        shell: bash
        run: |
          /usr/bin/ruby -rjson <<'RUBY'
          JSON.parse(ENV.fetch('STEPS_JSON')).each do |name, step|
            next unless step['outcome'] == 'failure'

            puts "::error title=Failed step: #{name}::The #{name} step failed. Open its logs for details; Fastlane failures also include an error annotation with the lane and cause."
          end
          RUBY

  close-milestone:
    # Publication can succeed even if a later documentation or summary step fails.
    needs: build
    if: ${{ always() && needs.build.outputs.published-tag != '' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: HaishinKit/.github/.github/workflows/milestones.yml@main
    with:
      release-tag: ${{ needs.build.outputs.published-tag }}
